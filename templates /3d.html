                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = item.dataset.action;
                    switch (action) {
                        case 'cloud':
                            saveProject();
                            break;
                        case 'download':
                            downloadProject();
                            break;
                        case 'gltf':
                            exportGLTF();
                            break;
                        case 'obj':
                            exportOBJ();
                            break;
                        case 'screenshot':
                            takeScreenshot();
                            break;
                        case 'library':
                            openLibrary();
                            break;
                        case 'share':
                            shareProject();
                            break;
                    }
                    saveMenu.classList.remove('open');
                });
            });

            // Library close
            document.getElementById('library-close').addEventListener('click', closeLibrary);
            document.getElementById('library-overlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeLibrary();
            });

            // File input for loading (hidden)
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.xena,application/json';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    loadProject(e.target.files[0]);
                }
                fileInput.value = '';
            });

            // Load via drag & drop
            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer.files;
                if (files.length > 0 && files[0].name.endsWith('.xena')) {
                    loadProject(files[0]);
                }
            });

            // Add "Load" option to save menu programmatically
            const loadItem = document.createElement('button');
            loadItem.className = 'item';
            loadItem.innerHTML = '<span class="icon">📂</span> Load Project';
            loadItem.addEventListener('click', () => {
                fileInput.click();
                document.getElementById('save-menu').classList.remove('open');
            });
            const divider = document.querySelector('#save-menu .divider');
            if (divider) {
                divider.parentNode.insertBefore(loadItem, divider.nextSibling);
            }
        }

        // ---- 20. AUTO-SAVE ----
        function setupAutoSave() {
            state.autoSaveInterval = setInterval(() => {
                if (state.hasChanges && state.scene3D) {
                    // Save draft to localStorage
                    try {
                        const data = getSceneData();
                        localStorage.setItem('xena_draft', JSON.stringify(data));
                    } catch (e) {
                        // silent
                    }
                }
            }, 30000); // every 30 seconds
        }

        function checkForDraft() {
            try {
                const draft = localStorage.getItem('xena_draft');
                if (draft) {
                    const data = JSON.parse(draft);
                    const age = Date.now() - new Date(data.project?.modified || Date.now()).getTime();
                    if (age < 86400000) { // less than 24 hours
                        showToast('🔄 Found unsaved draft. Restoring...', '💾');
                        setTimeout(() => {
                            loadSceneData(data);
                            showToast('✅ Draft restored', '💾');
                        }, 500);
                    }
                }
            } catch (e) {
                // silent
            }
        }

        // ---- 21. INITIALIZATION ----
        async function init() {
            try {
                updateLoading(5, 'Initializing XENA engine...');

                // Socket connection
                updateLoading(15, 'Connecting to neural interface...');
                initSocket();

                // Wait for socket
                await new Promise(resolve => {
                    if (state.socket && state.socket.connected) {
                        resolve();
                    } else {
                        const check = setInterval(() => {
                            if (state.socket && state.socket.connected) {
                                clearInterval(check);
                                resolve();
                            }
                        }, 100);
                        setTimeout(resolve, 3000); // fallback
                    }
                });

                // 3D Scene
                updateLoading(40, 'Building 3D workspace...');
                const container = document.getElementById('three-container');
                state.scene3D = new Scene3D(container);

                // Hand renderer
                updateLoading(55, 'Preparing hand tracking...');
                const overlay = document.getElementById('hand-overlay');
                state.handRenderer = new HandRenderer(overlay);

                // Camera
                updateLoading(65, 'Accessing camera...');
                await setupCamera();

                // UI
                updateLoading(80, 'Loading interface...');
                setupUI();
                setupTouchSupport();
                setupAutoSave();

                // Check for drafts
                setTimeout(checkForDraft, 1000);

                // Resize hand overlay on camera container resize
                const resizeObserver = new ResizeObserver(() => {
                    if (state.handRenderer) state.handRenderer.resize();
                });
                const cameraContainer = document.getElementById('camera-container');
                resizeObserver.observe(cameraContainer);

                // Done
                updateLoading(95, 'Calibrating gesture recognition...');
                setTimeout(() => {
                    updateLoading(100, '✨ XENA is ready!');
                    setTimeout(() => {
                        document.getElementById('loading').classList.add('hidden');
                        showToast('🚀 Welcome to XENA! Use your hand to control the 3D space.', '✨');
                        state.isLoading = false;
                    }, 400);
                }, 300);

            } catch (err) {
                console.error('Init error:', err);
                updateLoading(100, '⚠️ Error loading XENA');
                showToast('⚠️ Error initializing. Check console.', '❌');
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                }, 1500);
            }
        }

        // ---- 22. START ----
        document.addEventListener('DOMContentLoaded', init);

        // ---- 23. WINDOW CLEANUP ----
        window.addEventListener('beforeunload', () => {
            if (state.autoSaveInterval) {
                clearInterval(state.autoSaveInterval);
            }
            if (state.cameraStream) {
                state.cameraStream.getTracks().forEach(t => t.stop());
            }
            if (state.socket) {
                state.socket.disconnect();
            }
        });

        // ---- 24. EXPOSE GLOBALS FOR DEBUGGING ----
        window.XENA = {
            state,
            saveProject,
            loadProject,
            takeScreenshot,
            exportGLTF,
            exportOBJ,
            shareProject,
            openLibrary,
            getSceneData,
            showToast,
        };

        console.log('🚀 XENA initialized successfully!');
        console.log('📐 Version 1.0.0 - Professional 3D Gesture Workspace');
        console.log('💡 Use your hand to control the 3D space!');
        console.log('⌨️  Ctrl+S to save, Delete to remove selected');
    </script>
